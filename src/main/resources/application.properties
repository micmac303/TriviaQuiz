spring.application.name=TriviaQuiz

spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.properties.hibernate.globally_quoted_identifiers_skip_column_definitions=true

# Online play. The public address players use, e.g. the Cloudflare tunnel's https URL. Shown first
# on the host page when set. Pass it at launch: --trivia.public-url=https://...
trivia.public-url=

# Behind the tunnel, trust its X-Forwarded-* headers (Tomcat only trusts them from local proxies):
# the real client address is used, and https requests get a Secure session cookie.
server.forward-headers-strategy=native
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

